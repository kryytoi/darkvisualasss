{% extends "base.html" %}

{% block content %}
<div class="profile-wrapper">
    <div class="profile-card">
        <div class="profile-header">
            <div class="avatar-box">
                <i class="fa-solid fa-user-ninja"></i>
            </div>
            <h2>{{ session.get('username', 'Пользователь') }}</h2>
            <span class="badge admin-badge">
                <i class="fa-solid fa-shield-halved"></i> Administrator
            </span>
        </div>
        
        <div class="profile-details">
            <div class="info-card">
                <i class="fa-solid fa-user info-icon"></i>
                <div class="info-text">
                    <span class="label">Имя пользователя</span>
                    <span class="val">{{ session.get('username', 'MrDarko') }}</span>
                </div>
            </div>

            <div class="info-card">
                <i class="fa-solid fa-database info-icon"></i>
                <div class="info-text">
                    <span class="label">База данных</span>
                    <span class="val">Neon PostgreSQL</span>
                </div>
            </div>

            <div class="info-card">
                <i class="fa-solid fa-circle-check info-icon"></i>
                <div class="info-text">
                    <span class="label">Статус профиля</span>
                    <span class="val status-online">
                        <i class="fa-solid fa-circle"></i> Активен
                    </span>
                </div>
            </div>
        </div>

        <div class="profile-actions">
            <a href="{{ url_for('buy') if 'buy' in endpoints else '#' }}" class="btn btn-main">
                <i class="fa-solid fa-cart-shopping"></i> Магазин
            </a>
            <a href="{{ url_for('logout') if 'logout' in endpoints else '#' }}" class="btn btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Выйти
            </a>
        </div>
    </div>
</div>
{% endblock %}
