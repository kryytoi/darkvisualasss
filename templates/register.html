{% extends "base.html" %}
{% block title %}Регистрация — Dark Visuals{% endblock %}
{% block content %}

<section class="relative min-h-screen flex items-center justify-center px-6 pt-32 pb-20 overflow-hidden">
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] bg-purple-600/15 blur-[130px] rounded-full pointer-events-none"></div>

  <div class="reveal-scale in w-full max-w-md relative bg-neutral-900/40 backdrop-blur-xl border border-white/10 rounded-[2.5rem] p-10">
    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-purple-600/10 border border-purple-500/20 text-purple-400 text-xs font-bold mb-6">
      // АККАУНТ
    </div>
    <h2 class="text-3xl font-black mb-8">Регистрация</h2>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-semibold text-neutral-400 mb-2">Логин</label>
        <input type="text" id="username" name="username" placeholder="Минимум 3 символа" required minlength="3"
               class="w-full px-5 py-4 rounded-2xl bg-black/40 border border-white/10 focus:border-purple-500/50 outline-none transition-colors placeholder:text-neutral-600">
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold text-neutral-400 mb-2">Пароль</label>
        <input type="password" id="password" name="password" placeholder="Минимум 4 символа" required minlength="4"
               class="w-full px-5 py-4 rounded-2xl bg-black/40 border border-white/10 focus:border-purple-500/50 outline-none transition-colors placeholder:text-neutral-600">
      </div>
      <button type="submit" class="glow-btn w-full px-6 py-4 rounded-2xl purple-gradient font-bold text-lg transition-all mt-2">
        Создать аккаунт
      </button>
    </form>

    <div class="text-center text-sm text-neutral-400 mt-6">
      Уже есть аккаунт? <a href="{{ url_for('login') }}" class="text-purple-400 font-semibold hover:text-purple-300">Войти</a>
    </div>
  </div>
</section>

{% endblock %}
