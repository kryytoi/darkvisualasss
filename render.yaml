services:
  - type: web
    name: pvpmod-site
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # 1 sync-воркер блокировал все запросы, пока один ждал БД. Несколько воркеров + потоки.
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 30 --keep-alive 5"
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: LAUNCHER_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MOD_AES_KEY_BASE64
        sync: false
      - key: MOD_AES_IV_BASE64
        sync: false
      - key: MOD_FILE_URL
        sync: false
